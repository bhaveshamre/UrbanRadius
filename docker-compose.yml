services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: urban-radius-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/urban-radius-realm.json:/opt/keycloak/data/import/urban-radius-realm.json:ro

  mongodb:
    image: mongo:7
    container_name: urban-radius-mongodb
    ports:
      - "27017:27017"
    volumes:
      - urban-radius-mongo-data:/data/db

volumes:
  urban-radius-mongo-data:
