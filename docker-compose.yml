services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: urban-radius-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/urban-radius-realm.json:/opt/keycloak/data/import/urban-radius-realm.json:ro

  mongodb:
    image: mongo:7
    container_name: urban-radius-mongodb
    ports:
      - "27017:27017"
    volumes:
      - urban-radius-mongo-data:/data/db

  postgres-orders:
    image: postgres:16
    container_name: urban-radius-postgres-orders
    environment:
      POSTGRES_DB: urban_radius_orders
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
    ports:
      - "5433:5432"
    volumes:
      - urban-radius-orders-data:/var/lib/postgresql/data

  postgres-payments:
    image: postgres:16
    container_name: urban-radius-postgres-payments
    environment:
      POSTGRES_DB: urban_radius_payments
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
    ports:
      - "5434:5432"
    volumes:
      - urban-radius-payments-data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.7
    container_name: urban-radius-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"

volumes:
  urban-radius-mongo-data:
  urban-radius-orders-data:
  urban-radius-payments-data:
