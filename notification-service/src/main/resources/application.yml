spring:
  main:
    web-application-type: none
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5435/urban_radius_notifications
    username: urban
    password: urban
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service

urban-radius:
  user-service-url: http://user-service
  kafka:
    booking-events-topic: booking-events

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
